# /etc/nginx/sites-available/stagprime.com  — certbot --nginx adds the ssl_certificate lines.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
upstream stagprime { server 127.0.0.1:3000; keepalive 32; }

server { listen 80; listen [::]:80; server_name stagprime.com www.stagprime.com; return 301 https://www.stagprime.com$request_uri; }
server { listen 443 ssl http2; listen [::]:443 ssl http2; server_name stagprime.com; return 301 https://www.stagprime.com$request_uri;
  # ssl_certificate ... (certbot)
}
server {
  listen 443 ssl http2; listen [::]:443 ssl http2; server_name www.stagprime.com;
  # ssl_certificate /etc/letsencrypt/live/www.stagprime.com/fullchain.pem;  (certbot)
  # ssl_certificate_key /etc/letsencrypt/live/www.stagprime.com/privkey.pem;
  client_max_body_size 12m;   # CV / order / chat uploads (app limits: 5–10 MB)

  gzip on; gzip_vary on; gzip_comp_level 5; gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/xml application/rss+xml image/svg+xml;
  # brotli on; brotli_comp_level 5; brotli_types text/plain text/css application/javascript application/json application/xml image/svg+xml;  # needs libnginx-mod-http-brotli

  location /_next/static/ { proxy_pass http://stagprime; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location /img/ { proxy_pass http://stagprime; add_header Cache-Control "public, max-age=31536000, immutable"; }

  # Live chat: Server-Sent Events must not be buffered
  location ~ ^/api/(chat|admin/chat)/stream { proxy_pass http://stagprime; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_buffering off; proxy_cache off; proxy_read_timeout 1h; chunked_transfer_encoding on;
    proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }

  location / {
    proxy_pass http://stagprime; proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;   # websocket-ready
    proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
